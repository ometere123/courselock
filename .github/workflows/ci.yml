name: CourseLock offline preflight
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python scripts/preflight.py
      - run: python -m py_compile contracts/courselock.py contracts/course_consumer.py
      - name: GenVM lint and runtime validation
        env:
          GENVM_VERSION: v0.3.0-rc7
        run: |
          genvm-lint --version
          genvm-lint check contracts/courselock.py --json
          genvm-lint check contracts/course_consumer.py --json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: test "$(./node_modules/.bin/genlayer --version)" = "0.39.1"
      - run: node --check scripts/deploy_studionet.mjs && node --check scripts/assert_studionet.mjs
